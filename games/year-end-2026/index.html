<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 最後 31 天・倒數撕日曆｜Mia 療癒小時光</title>
<meta name="theme-color" content="#FDE6DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="年末撕日曆">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Nunito:wght@700;800&family=Cormorant+Garamond:wght@600&display=swap">
<script src="../../config.js"></script>
<style>
:root{color-scheme:light;
  --bg1:#FFF4EE;--bg2:#FDE6DB;--bg3:#F8D3C3;--primary:#B5523B;--on:#fff;--ink:#3B302A;--sub:#6E6159;--card:rgba(255,255,255,.9);--line:rgba(181,82,59,.16);--soft:#FBE1D6;--accent-ink:#8A3A24;
  --brown:#5A4632;--gold:#C9A35A;--paper:#fff;
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;--serif:'Noto Serif TC',serif;--num:'Nunito',var(--sans)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.7;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;background-color:var(--bg2);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
.hd{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg1) 85%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:6px;height:54px}
.hd .back{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;color:var(--accent-ink)}
.hd b{font-family:var(--serif);font-size:17px;color:var(--brown);flex:1}
.hd nav{display:flex;gap:2px}
.hd nav button{min-height:40px;padding:0 10px;border-radius:999px;font-size:13.5px;color:var(--sub);position:relative}
.hd nav button.on{background:var(--soft);color:var(--accent-ink);font-weight:700}
.dot{position:absolute;top:6px;right:4px;width:8px;height:8px;border-radius:50%;background:#D9534F}
.demo{font-size:11px;font-weight:700;background:#FFF1C9;color:#6B4A00;border-radius:999px;padding:3px 9px;white-space:nowrap}
main{padding:14px 0 40px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.mut{color:var(--sub)}.small{font-size:13px}.tiny{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:999px;background:var(--primary);color:var(--on);font-weight:700;font-size:15px;width:100%;text-decoration:none}
.btn2{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--primary);background:#fff;color:var(--accent-ink);font-weight:700;font-size:14px;text-decoration:none}
.lnk{min-height:44px;color:var(--accent-ink);font-weight:700;font-size:13.5px;text-decoration:underline}
.btn[disabled],.btn2[disabled]{opacity:.5;pointer-events:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notice{background:#FFF7E6;border:1px solid #EFD9A8;color:#5E4512;border-radius:14px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.notice button{color:#5E4512;font-weight:700;text-decoration:underline;white-space:nowrap}
/* 撕頁 */
.binder{height:30px;background:#8A4A39;border-radius:14px 14px 0 0;display:flex;justify-content:space-around;align-items:center;padding:0 34px;position:relative;z-index:3}
.ring{width:12px;height:12px;border-radius:50%;background:var(--bg1);border:2px solid #5A2E22}
.pad{position:relative}
.pg{background:var(--paper);border:1px solid #EBD9CF;border-top:0;padding:18px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:2}
.under{position:absolute;left:0;right:0;top:30px;bottom:-8px;background:#fff;border:1px solid #EBD9CF;border-top:0;z-index:1;box-shadow:0 6px 0 -2px #F3E3DA,0 12px 0 -4px #EBD3C7;display:flex;align-items:flex-start;justify-content:center;padding-top:30px}
.under span{font-family:var(--num);font-weight:800;font-size:60px;color:#E8D5CC}
.date{font-family:var(--num);font-weight:800;font-size:96px;line-height:1;color:var(--primary)}
.cd{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:var(--soft);color:var(--accent-ink);font-weight:700;font-size:13px}
.pull{color:var(--accent-ink);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px}
.pull svg{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.tearing{transition:transform .7s cubic-bezier(.5,0,.8,.6),opacity .7s;transform:translate(40px,520px) rotate(-14deg)!important;opacity:0}
.qcard{background:#fff;border:1px solid #EBD9CF;border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.qt{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--brown);line-height:1.5}
.guide{font-size:14px;color:var(--sub)}
/* 彈珠與糖罐 */
.m{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 13%,var(--c) 46%,var(--d) 100%);flex:none}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk{min-height:88px;border-radius:16px;border:1.5px solid #EBD9CF;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:#4A433B}
.pk .m{width:40px;height:40px}
.pk.sel{border:2px solid var(--primary);background:var(--bg1)}
.jarbox{position:relative;width:240px;margin:0 auto}
.lid{width:170px;height:20px;margin:0 auto -2px;background:var(--gold);border-radius:8px}
.jar{width:240px;min-height:230px;border:3px solid rgba(138,74,57,.35);border-radius:34px 34px 54px 54px;background:rgba(255,255,255,.6);padding:16px;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;gap:5px;justify-content:center}
.jar.small{width:170px;min-height:150px;border-radius:26px 26px 40px 40px;padding:10px}
.jar .it{border-radius:50%;line-height:0}
.jar button.it:focus-visible{outline:2px solid var(--primary)}
.drop{position:absolute;left:50%;top:-40px;margin-left:-15px;animation:drop .8s cubic-bezier(.5,0,.9,.6) forwards;z-index:5}
@keyframes drop{0%{transform:translateY(0)}70%{transform:translateY(200px)}85%{transform:translateY(184px)}100%{transform:translateY(196px);opacity:0}}
.shake{animation:sh .5s}@keyframes sh{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
/* 寫紀錄 */
textarea{width:100%;min-height:170px;border-radius:14px;border:1px solid #E1CFC4;padding:12px;font:15px/1.75 var(--sans);color:var(--ink);background:#fff;resize:vertical}
.vs{border:0;display:flex;flex-direction:column;gap:6px}
.vs legend{font-weight:700;font-size:14px;margin-bottom:6px;color:var(--brown)}
.opt{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid #E6DED0;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;min-height:48px;cursor:pointer}
.opt.on{border:2px solid var(--primary);background:#FFF8F4}
.opt input{margin-top:4px;accent-color:var(--primary);width:18px;height:18px;flex:none}
.opt.off{opacity:.55;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:#2F5E47;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:#8A2F25}
/* 盲盒 */
.blind{width:170px;height:170px;margin:4px auto 0;position:relative}
.bx{position:absolute;left:35px;top:78px;width:100px;height:74px;background:#F6E7C8;border:2px solid var(--gold);border-radius:8px}
.bl{position:absolute;left:25px;top:62px;width:120px;height:22px;background:#E9D2A3;border:2px solid var(--gold);border-radius:6px;transition:transform .5s}
.opened .bl{transform:rotate(-22deg) translate(-12px,-26px)}
.candy{position:absolute;left:47px;top:-6px;z-index:3;opacity:0;transform:translateY(60px) scale(.4);transition:all .6s cubic-bezier(.3,1.6,.6,1)}
.opened .candy{opacity:1;transform:none}
.shaking{animation:sh2 .9s}@keyframes sh2{10%,50%,90%{transform:rotate(-6deg)}30%,70%{transform:rotate(6deg)}}
.lineq{background:#fff;border:1px solid #E6DED0;border-radius:16px;padding:12px 14px;text-align:left}
.cpn{background:#fff;border:2px solid var(--gold);border-radius:14px;display:grid;grid-template-columns:1fr 92px;overflow:hidden;text-align:left}
.cpn .l{padding:14px;display:flex;flex-direction:column;gap:2px;border-right:2px dashed var(--gold)}
.cpn .r{background:#F6E7C8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--num);color:#8A4A39}
.warn{background:#FFF8E8;border:1px solid #EBD9AE;border-radius:14px;padding:12px 14px;color:#6B5222;display:flex;flex-direction:column;gap:6px}
.softw{background:#F3EEF9;border:1px solid #D9CCEC;border-radius:14px;padding:12px 14px;color:#4B3D66;display:flex;flex-direction:column;gap:6px}
mark{background:#FCE3A6;border-radius:4px;padding:0 2px;color:inherit}
.softw+.card mark{background:#E9DFF7}
/* 月曆 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{font-size:12px;color:var(--sub);text-align:center;font-weight:700}
.c{min-height:60px;border-radius:10px;background:#fff;border:1px solid #EFE2D9;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px;font-size:11px}
.c b{font-family:var(--num);font-size:15px;color:var(--brown)}
.c .m{width:18px;height:18px}
.c em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent-ink)}
.c.e{background:transparent;border:0}
.c.w{background:var(--soft);border-color:#F0C8B6}
.c.x{border:1.5px dashed var(--primary)}
.c.t{border:2px solid var(--primary)}
.c.f{background:rgba(255,255,255,.45)}.c.f b{color:#A79E93}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub)}
.lg span{display:inline-flex;align-items:center;gap:4px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
/* 收藏 */
.col{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cat{background:#fff;border:1px solid #EBD9CF;border-radius:12px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);gap:2px;text-align:center}
.cat.lock{opacity:.4}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 div{background:#fff;border:1px solid #E6DED0;border-radius:14px;padding:8px}
.stat3 b{display:block;font-family:var(--num);font-size:24px;color:var(--primary);line-height:1.2}
/* 悄悄話、貼紙 */
.paper{background:#FFFDF8;border:1px solid #EBD9AE;border-radius:6px;padding:22px 20px 18px;position:relative;box-shadow:0 8px 18px -10px rgba(90,46,34,.35);transform:rotate(-1.2deg);animation:unfold .5s ease-out}
@keyframes unfold{from{transform:rotate(-1.2deg) scaleY(.2);opacity:0}}
.paper:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #EAD9C3}
.stk{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:#4A433B;min-width:48px;min-height:52px}
.stk i{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(90,46,34,.2)}
.stk.on i{outline:3px solid var(--primary);outline-offset:1px}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 2px;justify-items:center}
.env{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--primary);border:2px solid var(--primary);border-radius:999px;padding:4px 12px 4px 8px;font-size:13px;font-weight:700;min-height:36px}
.wall{background:#fff;border:1px solid #EBD9CF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 9px;border-radius:999px;background:var(--soft);color:var(--accent-ink);font-size:12px;font-weight:700;white-space:nowrap}
.chip.g{background:#F6E7C8;color:#6B4A1E}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #E6DED0;background:#fff;color:var(--sub);font-size:13px;font-weight:700}
.fbtn.on{background:var(--soft);color:var(--accent-ink);border-color:var(--soft)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #EFE8DC;font-size:13.5px}
.row:last-child{border-bottom:0}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:#ECEEF2;color:#5B6372;white-space:nowrap}
.tag.me{background:#F6E7C8;color:#6B4A1E}
/* 對話框 */
.mb{position:fixed;inset:0;z-index:80;background:rgba(30,20,15,.45);display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;color:#3B302A}
.md h3{font-family:var(--serif);font-size:18px;color:var(--brown)}
.rule{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rule b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-family:var(--num)}
.ck{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:700;color:var(--brown)}
.ck input{width:20px;height:20px;accent-color:var(--primary)}
.rs label{display:flex;gap:10px;align-items:center;min-height:44px;border:1px solid #E6DED0;border-radius:12px;padding:0 12px;margin-bottom:6px}
.spin{display:flex;justify-content:center;padding:60px 0}.spin i{width:30px;height:30px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--primary);animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.ft{padding:16px 0 calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--sub);text-align:center}
/* 2026.11.22 調整：與自己對話、滑桿、拖曳糖果、盲盒稀有度、圖鑑 */
.talk{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:14px;color:var(--accent-ink);letter-spacing:.08em}
.talk:before,.talk:after{content:"";width:28px;height:1px;background:#E1BFAF}
.qcard textarea{min-height:130px;background:#FFFBF8;text-align:left}
.vwrap{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:4px}
.vsl{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:#F6E3D9;border-radius:999px;padding:4px;min-height:52px;touch-action:none}
.vsl .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:var(--primary);box-shadow:0 2px 8px rgba(138,74,57,.35);transform:translateX(calc(var(--i,0)*100%));transition:transform .28s cubic-bezier(.3,1.3,.5,1);cursor:grab}
.vsl button{position:relative;z-index:1;font-weight:700;font-size:13.5px;color:#8A7466;border-radius:999px;min-height:44px;transition:color .2s}
.vsl button.on{color:var(--on)}
.vsl button.off{color:#C2B4AA;text-decoration:line-through}
.vdesc{font-size:13px;color:var(--sub);text-align:center;background:var(--bg1);border-radius:12px;padding:8px 10px;min-height:38px}
.jarbox:has(.lid.open){padding-top:30px}
.lid.open{transform:translate(-28px,-2px) rotate(-14deg);transform-origin:left bottom}
.jarbox.sm{width:190px}.jarbox.sm .lid{width:130px}
.jar.mouth{border-top-color:transparent;position:relative}
.jar.mouth:before{content:"";position:absolute;left:24px;right:24px;top:-3px;height:3px;border-radius:3px;background:rgba(138,74,57,.35)}
.jarbtn{display:block;margin:0 auto;padding:6px 10px;border-radius:24px}
.jarbox{transition:transform .2s}
.jarbox.hot .jar{box-shadow:0 0 0 4px rgba(181,82,59,.12)}
.jarbox.over{transform:scale(1.04)}.jarbox.over .jar{box-shadow:0 0 0 6px rgba(181,82,59,.25);background:#fff}
.pk{touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.pk.lift{transform:scale(.94);opacity:.6}
.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(90,46,34,.28))}
.okm{background:#2F5E47;color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700}
.badge{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.b1{background:#ECEEF2;color:#5B6372}.b2{background:#FDE6DB;color:#8A3A24}.b3{background:#F6E7C8;color:#6B4A1E}
.blind .glow{position:absolute;left:50%;top:40px;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;opacity:0;transition:opacity .6s .2s;background:radial-gradient(circle,#FFD9E4 0,rgba(255,200,215,.55) 40%,rgba(255,200,215,0) 70%);z-index:0}
.box-gold .blind .glow{background:conic-gradient(from 0deg,rgba(255,236,170,0),rgba(255,226,140,.8),rgba(255,236,170,0) 25%,rgba(255,226,140,.8) 50%,rgba(255,236,170,0) 75%,rgba(255,226,140,.8));-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.opened .glow{opacity:1}
.box-rare .candy,.box-gold .candy{left:37px;top:-26px}
.sp{position:absolute;font-style:normal;color:#E0B12A;font-size:18px;opacity:0;z-index:4}
.opened .sp{animation:tw 1.6s ease-in-out infinite}
.s1{left:6px;top:-10px}.s2{right:4px;top:4px;animation-delay:.4s!important}.s3{left:20px;top:60px;animation-delay:.8s!important}.s4{right:18px;top:-30px;animation-delay:1.2s!important}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
body.goldbg{background:linear-gradient(180deg,#FFF8E6,#FBE7C0 60%,#F3D18E) fixed}
.tipx{position:absolute;z-index:60;background:#3A2E25;color:#fff;font-size:13px;border-radius:10px;padding:6px 11px;white-space:nowrap;pointer-events:none}
.tipx:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#3A2E25}
.jar .it.sw{border-radius:8px;line-height:0}
.sec{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:var(--brown)}
.sec em{font-style:normal;font-weight:400;font-size:12px;color:var(--sub)}
.g6{display:grid;grid-template-columns:repeat(6,1fr);margin-top:8px}
.dd{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--sub);gap:2px}
.dd small{font-size:10.5px;color:var(--accent-ink)}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dx{background:#fff;border:1px solid #EFE2D9;border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:8px 2px 6px;font-size:12px;color:var(--ink);gap:2px;min-height:92px}
.dx small{font-size:11px;color:var(--accent-ink);font-weight:700}
.dx.off{color:#B5AAA0;cursor:default}
.dx.rare{background:#FFF7F2;border-color:#F0C8B6}

    const e = entryOf(p);
    if (e) cells += `<button class="c ${e.chars > 0 ? 'w' : ''}" data-open="${p}" aria-label="12/${p} 已撕${e.chars ? '，有寫' : ''}"><b>${p}</b>${marble(e.marble, 18)}${e.tear === '補撕' ? '<em>補</em>' : ''}</button>`;
    else if (p === t && !jan) cells += `<button class="c t" data-today aria-label="12/${p} 今天"><b>${p}</b><em>今天</em></button>`;
    else if (p < t || jan) cells += `<button class="c x" data-miss="${p}" aria-label="12/${p} 錯過，可補撕"><b>${p}</b><em>可補撕</em></button>`;
    else cells += `<button class="c f" data-future="${p}" aria-label="12/${p} 還沒到"><b>${p}</b></button>`;
  }
  mount(`<div class="stack"><div style="display:flex;justify-content:space-between;align-items:center"><b class="qt" style="font-size:19px">2026 年 12 月</b><span class="mut small">${d.stats.torn} / 31</span></div>
    <div class="cal"><span class="wd">日</span><span class="wd">一</span><span class="wd">二</span><span class="wd">三</span><span class="wd">四</span><span class="wd">五</span><span class="wd">六</span>${cells}</div>
    <div class="lg"><span><i class="sw" style="background:var(--soft);border:1px solid #F0C8B6"></i>撕了也寫了</span><span><i class="sw" style="background:#fff;border:1px solid #EFE2D9"></i>只撕頁</span><span><i class="sw" style="border:1.5px dashed var(--primary)"></i>錯過，可補撕</span><span><i class="sw" style="border:2px solid var(--primary)"></i>今天</span></div>
    <div id="pick"></div><p class="tiny mut">補撕一樣放糖果、一樣能寫，只是不算進「連續天數」。錯過的頁可以補到 1/31。</p></div>`);
  $$('[data-open]').forEach(b => b.addEventListener('click', () => openEntry(+b.dataset.open)));
  $$('[data-today]').forEach(b => b.addEventListener('click', () => go('today')));
  $$('[data-future]').forEach(b => b.addEventListener('click', () => toast('12/' + b.dataset.future + ' 再見')));
  $$('[data-miss]').forEach(b => b.addEventListener('click', () => {
    const p = +b.dataset.miss;
    $('#pick').innerHTML = `<div class="card stack"><b>12/${String(p).padStart(2, '0')}・還沒撕</b><span class="small mut">${esc(PAGE(p).q)}</span><button class="btn" data-late="${p}">補撕這一頁</button></div>`;
    $('[data-late]').addEventListener('click', () => flowQuestion(p));
  }));
}

/* ---------- 心聲牆 ---------- */
async function viewWall(filter) {
  filter = filter || S.wallFilter || 'all'; S.wallFilter = filter;
  mount('<div class="spin" role="status"><i></i><span class="sr">載入中</span></div>');
  let r; try { r = await api.call('calWall', { filter }); } catch (e) { return mount(`<div class="card">${esc(e.message)}</div>`); }
  if (r.closed) {
    return mount(`<div class="stack"><div class="card stack" style="align-items:center;text-align:center;padding:28px 16px"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <b class="qt" style="font-size:18px">心聲牆暫時休息中</b><span class="mut">牆上的心情都好好收著，休息完就會回來。</span></div>
      <div class="card"><b class="small">今天想寫的話，一樣可以留下</b><p class="small">選「只給自己」或「開一扇小窗」，糖果照樣能拆。</p></div><button class="btn" data-go="today">去撕今天這頁</button></div>`);
  }
  const f = (k, l) => `<button class="fbtn ${filter === k ? 'on' : ''}" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`;
  mount(`<div class="stack"><div style="display:flex;justify-content:space-between;align-items:center"><b class="qt" style="font-size:19px">大家的年末</b><button class="lnk" data-rules>小約定</button></div>
    <p class="tiny mut">匿名。只能送貼紙、不能留言；覺得不適合可以回報。</p>
    <div class="chips">${f('all', '全部')}${f('today', '今天這題')}${f('mine', '我寫的')}</div>
    ${r.items.length ? r.items.map(it => `<div class="wall" data-id="${esc(it.id)}"><span class="tiny mut">12/${String(it.page).padStart(2, '0')}・${esc(it.q)}</span><span style="white-space:pre-wrap">${esc(it.content)}</span>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap"><span class="chips">${Object.keys(it.stickers).filter(k => it.stickers[k] > 0).map(k => `<span class="chip">${esc(k)} ${it.stickers[k]}</span>`).join('') || '<span class="tiny mut">還沒有貼紙</span>'}</span>${it.mine && it.miaReplied ? '<span class="chip g">Mia 回應了</span>' : ''}</div>
      ${it.mine ? (it.miaReplied ? `<button class="lnk" style="align-self:flex-start;min-height:32px" data-mine="${it.page}">這是你寫的・點開看回應</button>` : '<span class="tiny mut">這是你寫的</span>') : `<div style="display:grid;grid-template-columns:1fr auto;gap:8px"><button class="btn2" data-stk="${esc(it.id)}">${it.mySticker ? '已送「' + esc(it.mySticker) + '」・換一張' : '送一張貼紙'}</button><button class="btn2" style="border-color:#C9BFB5;color:#6E6159" data-rep="${esc(it.id)}" ${it.reported ? 'disabled' : ''}>${it.reported ? '已回報' : '回報'}</button></div>`}</div>`).join('')
      : '<div class="card mut small">這裡還沒有內容。寫紀錄時選「放上心聲牆」，就會匿名出現在這裡。</div>'}</div>`);
  $$('[data-f]').forEach(b => b.addEventListener('click', () => viewWall(b.dataset.f)));
  $$('[data-mine]').forEach(b => b.addEventListener('click', () => openEntry(+b.dataset.mine)));
  $('[data-rules]').addEventListener('click', () => modal('心聲牆的小約定', `<div class="stack" style="gap:8px">${['不放自己或別人的電話、LINE ID、地址、網址等個人資料', '不罵人、不騷擾、不指名道姓批評任何人', '不廣告、不推銷、不拉人加群組', '不放違法、色情或威脅別人的內容', '抱怨、氣話和針對人的負面話，留給自己寫、自己看就好'].map((t, i) => `<div class="rule"><b>${i + 1}</b><span>${t}</span></div>`).join('')}</div>`));
  $$('[data-stk]').forEach(b => b.addEventListener('click', () => modal('送一張貼紙', `<div class="sgrid">${r.stickers.map(s => `<button class="stk" data-s="${esc(s)}">${stkIcon(s)}${esc(s)}</button>`).join('')}</div>`, [{ l: '取消', v: null, c: 'btn2' }],
    (bg, close) => $$('[data-s]', bg).forEach(x => x.addEventListener('click', async () => { close(null); try { await api.call('calWallSticker', { entryId: b.dataset.stk, sticker: x.dataset.s }); toast('已送出「' + x.dataset.s + '」'); viewWall(filter); } catch (e) { errToast(e); } })))));
  $$('[data-rep]').forEach(b => b.addEventListener('click', async () => {
    const v = await modal('回報這一篇', `<p class="small mut">為什麼想回報？回報不會公開是誰。</p><div class="rs" role="radiogroup" aria-label="回報原因">${r.reports.map((x, i) => `<label><input type="radio" name="rr" value="${esc(x)}" ${i ? '' : 'checked'}>${esc(x)}</label>`).join('')}</div>`,
      [{ l: '送出回報', v: bg => ($('input[name=rr]:checked', bg) || {}).value }, { l: '取消', v: null, c: 'btn2' }]);
    if (!v) return; try { await api.call('calReport', { entryId: b.dataset.rep, reason: v }); toast('謝謝你，已經收到'); viewWall(filter); } catch (e) { errToast(e); }
  }));
}

/* ---------- 展示模式 ---------- */
function demoMenu() {
  const cur = S.d ? S.d.now.slice(0, 10) : '';
  modal('展示模式', `<p class="small mut">資料只存在這個瀏覽器，不會動到正式資料。現在的展示日期：${esc(cur)}</p>
    <label class="small" for="dd" style="font-weight:700">換展示日期</label><input id="dd" type="date" min="2026-11-25" max="2027-02-05" value="${esc(cur)}" style="min-height:44px;border:1px solid #E1CFC4;border-radius:12px;padding:0 10px">`,
    [{ l: '換到這一天', v: bg => ({ date: $('#dd', bg).value }) }, { l: '切換身分', v: 'who', c: 'btn2' }, { l: '把心聲牆關起來／打開（模擬後台）', v: 'wall', c: 'btn2' }, { l: '重設展示資料', v: 'reset', c: 'btn2' }, { l: '關閉', v: null, c: 'btn2' }]).then(async v => {
    if (!v) return;
    if (v === 'who') return demoLogin();
    if (v === 'reset') { MOCK.reset(); U.ls.del(Local.key); U.ls.del('miaplay.cal.homeTip'); return load(); }
    if (v === 'wall') { const st = await MOCK.call('adminCalSettings', {}, 'demo-admin'); await MOCK.call('adminCalWall', { op: st.settings.wallOpen ? 'close' : 'open' }, 'demo-admin'); toast(st.settings.wallOpen ? '心聲牆已關起來' : '心聲牆已打開'); return load(); }
    if (v.date) { MOCK.setDate(v.date); S.flow = null; return load(); }
  });
}

/* ---------- 開始 ---------- */
(async function boot() {
  Theme.boot();
  if (!IS_DEMO) await LineAuth.handleReturn();
  const h = (location.hash || '').slice(1); if (['jar', 'calendar', 'wall', 'today'].includes(h)) S.view = h;
  await load();
})();
})();
</script>
</body>
</html>

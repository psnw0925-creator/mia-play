<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>互動後台｜Mia 小遊戲</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<script src="config.js"></script>
<style>
:root{color-scheme:light;
  --bg:#F7F4F1;--paper:#fff;--ink:#2F2A27;--sub:#6B625C;--line:#E7DFD9;--line2:#D9CEC6;
  --pri:#B5523B;--pri2:#8A3A24;--soft:#FBE7DE;--ok:#2F6B4A;--okbg:#DDEFE4;--warn:#7A5A1E;--warnbg:#F8EAC9;--bad:#A4473B;--badbg:#F7DEDA;
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif;--serif:'Noto Serif TC',serif;--lat:'Cormorant Garamond',serif;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--pri2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.A{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;text-decoration:none;color:var(--ink)}
.logo b{font-family:var(--lat);font-size:22px;font-weight:600;line-height:1}
.logo small{font-size:12px;color:var(--sub);display:block}
.pearl{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff 0 14%,#C4DAF3 45%,#56709F 100%)}
.nav a{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px}
.nav a.on{background:var(--soft);color:var(--pri2);font-weight:700}
.side .sw{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.side .sw a{font-size:13px;color:var(--sub);min-height:36px;display:flex;align-items:center;padding:0 12px;text-decoration:none}
.main{padding:22px 24px 60px;max-width:1180px;width:100%}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph h1{font-family:var(--serif);font-size:24px;flex:1;min-width:200px}
.demo{font-size:11px;font-weight:700;background:#FFF1C9;color:#6B4A00;border-radius:999px;padding:3px 9px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .r{margin-left:auto;font-size:13px;font-weight:500}
.muted{color:var(--sub)}.small{font-size:12.5px}
.k4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k span{display:block;font-size:12px;color:var(--sub)}
.k b{font-size:26px;color:var(--pri2);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--pri);color:#fff;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn.l{background:#fff;color:var(--pri2);border:1px solid var(--pri)}
.btn.g{background:transparent;color:var(--pri2);padding:0 8px}
.btn.s{min-height:32px;padding:0 11px;font-size:12.5px}
.btn.d{background:#fff;color:var(--bad);border:1px solid #E5B8B1}
.btn[disabled]{opacity:.5;pointer-events:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
th{background:#FBF8F6;text-align:left;font-weight:700;font-size:12.5px;color:var(--sub);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.c-open{background:var(--okbg);color:var(--ok)}.c-up{background:var(--warnbg);color:var(--warn)}.c-closed,.c-ended{background:#ECEEF2;color:#4E5666}.c-draft{background:#F1ECE8;color:#6B625C}
.c-hot{background:var(--pri);color:#fff}.c-star{background:var(--warnbg);color:var(--warn)}.c-tag{background:#EEF1F6;color:#3E4E6E;margin:0 4px 4px 0}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 120px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:12px;border-radius:6px;background:#F3ECE8;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--pri)}
.hm{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:4px;font-size:12px;text-align:center}
.hm span{padding:7px 0;border-radius:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 0 14px;border-bottom:1px solid var(--line)}
.tabs a{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;text-decoration:none;color:var(--sub);font-weight:700;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--pri2);border-bottom-color:var(--pri)}
.stks{display:flex;flex-wrap:wrap;gap:6px}
.stkb{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px}
.stkb.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.wi{border-top:1px solid var(--line);padding:10px 0}
.wi:first-of-type{border-top:0}
.cpbox{border:2px solid #C9A35A;border-radius:14px;padding:14px;margin-top:10px;background:#FFFCF5;display:flex;flex-direction:column;gap:4px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.cvs{display:flex;flex-wrap:wrap;gap:8px}.cv{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;min-height:36px}.cv input{position:absolute;opacity:0}.cv span{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}.cv:has(input:checked){border-color:#B5523B;box-shadow:0 0 0 2px rgba(181,82,59,.2);font-weight:700}.cv:has(input:focus-visible){outline:2px solid #B5523B}
.f label,.lbl{font-size:12.5px;font-weight:700;color:var(--sub)}
.f input,.f select,.f textarea,.in{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.f{flex:1;min-width:160px}
.qb{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#FFFCFA}
.qb .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qb .hd b{font-size:13px;color:var(--pri2)}
.op{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:6px;align-items:center;margin-bottom:6px}
.op .k{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--pri2);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.sw2{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer}
.sw2 input{width:18px;height:18px;accent-color:var(--pri)}
.pv{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;border:1px solid var(--line)}
.err{color:var(--bad);font-size:12.5px;font-weight:700}
.okt{color:var(--ok);font-size:12.5px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:#2B2622;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;max-width:92vw}
.toast.err{background:#8A2F25}
.mb{position:fixed;inset:0;z-index:70;background:rgba(30,20,15,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.md h3{font-size:17px}
.md .ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.prompt{background:#2B2622;color:#F3ECE0;border-radius:12px;padding:12px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;max-height:46vh;overflow:auto;font-family:ui-monospace,Menlo,"Noto Sans TC",monospace}
.sticky{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.spin{display:flex;justify-content:center;padding:60px 0}.spin i{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--pri);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:420px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:12px;text-align:center}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media (max-width:860px){
  .A{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:6px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .logo{padding:0 8px 0 0}.logo small{display:none}
  .nav{display:flex;gap:2px}.nav a{white-space:nowrap;min-height:40px;padding:0 10px}
  .side .sw{display:none}
  .main{padding:16px 12px 60px}
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:80px 1fr 96px}
  .tw table{min-width:640px}
}
</style>
</head>
<body>
<div id="app"><div class="spin" role="status"><i></i><span class="sr">載入中</span></div></div>
<script>


(function () {
'use strict';
const CFG = window.MIA_PLAY_CONFIG || {};
const IS_DEMO = false;
const ADMIN_URL = (CFG.PLAY_URL || '') + 'admin.html';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const U = {
  rid(n) { const a = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % a.length]; return s; },
  ls: { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } },
  ss: { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }, del(k) { try { sessionStorage.removeItem(k); } catch (e) { } } },
  d(s) { if (!s) return ''; const t = String(s); return t.slice(5, 10).replace('-', '/') + (t.length > 11 ? ' ' + t.slice(11, 16) : ''); },
  pct(v) { return v == null ? '—' : v + '%'; },
  dl(name, text, type) { const b = new Blob([text], { type: type || 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
};
const TYPES = { quiz: '測驗', trivia: '問答', poll: '心情投票' };
const COVERS = { navy: '深夜藍', plum: '梅子紫', forest: '森林綠', wine: '酒紅', teal: '湖水青', cocoa: '可可棕' };
const COVER_BG = { navy: '#24314F', plum: '#4A2F45', forest: '#2E4A3E', wine: '#5A2A30', teal: '#1F4A52', cocoa: '#4A3528' };
const ST = { open: ['開放中', 'c-open'], upcoming: ['排定上架', 'c-up'], ended: ['待結算', 'c-ended'], closed: ['已收起', 'c-closed'], draft: ['草稿', 'c-draft'] };
const chip = st => `<span class="chip ${ST[st] ? ST[st][1] : ''}">${ST[st] ? ST[st][0] : esc(st)}</span>`;
function toast(m, k) { const t = document.createElement('div'); t.className = 'toast' + (k === 'err' ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
const errToast = e => toast((e && e.message) || '系統忙碌中，請稍後再試', 'err');
class ApiError extends Error { constructor(c, m, d) { super(m || '系統忙碌中，請稍後再試'); this.code = c; this.data = d; } }
function modal(title, html, buttons, onOpen) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'mb';
    bg.innerHTML = `<div class="md" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${html}<div class="ft">${(buttons || [{ l: '關閉', v: null, c: 'l' }]).map((b, i) => `<button class="btn ${b.c || ''}" data-i="${i}">${esc(b.l)}</button>`).join('')}</div></div>`;
    const close = v => { bg.remove(); res(v); };
    bg.addEventListener('click', e => { if (e.target === bg) close(null); const b = e.target.closest('[data-i]'); if (b) { const bt = (buttons || [{ v: null }])[+b.dataset.i]; if (bt.check && !bt.check(bg)) return; close(typeof bt.v === 'function' ? bt.v(bg) : bt.v); } });
    document.body.appendChild(bg); if (onOpen) onOpen(bg); const f = $('input,textarea,button', bg); if (f) f.focus();
  });
}

/* ---------- 管理員登入：登入過預約後台就直接認得（只讀 mia.session.admin）；否則用小遊戲自己的 LINE 登入＋開通碼 ---------- */
const Session = {
  own: IS_DEMO ? 'miaplay.demo.admin' : 'miaplay.session.admin',
  shared: IS_DEMO ? 'miaplay.demo.sharedAdmin' : 'mia.session.admin',
  read(k) { let s = null; try { s = JSON.parse(U.ls.get(k) || 'null'); } catch (e) { } if (s && s.expiresAt && s.expiresAt < new Date().toISOString()) return null; return s && s.token ? s : null; },
  get() { const s = this.read(this.shared); if (s && U.ss.get('miaplay.admin.skip') !== s.token) return s; return this.read(this.own); },
  setOwn(s) { U.ls.set(this.own, JSON.stringify(s)); },
  hasOwn() { return !!this.read(this.own); },
  drop() { const s = this.read(this.shared); if (s && U.ss.get('miaplay.admin.skip') !== s.token) { U.ss.set('miaplay.admin.skip', s.token); return true; } return false; },
  token() { const s = this.get(); return s ? s.token : ''; },
  user() { const s = this.get(); return s ? s.user : null; }
};
const api = {
  async call(action, data) {
    const token = Session.token();
    try {
      if (IS_DEMO) return await MOCK.call(action, data || {}, token).catch(e => { throw new ApiError(e.code || 'INTERNAL', e.message); });
      if (!/^https:\/\//.test(CFG.PLAY_GAS_URL || '')) throw new ApiError('CONFIG', '後台還沒設定完成（PLAY_GAS_URL）');
      const r = await fetch(CFG.PLAY_GAS_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action, token, data: data || {} }) });
      const j = await r.json();
      if (!j.ok) throw new ApiError(j.error && j.error.code, j.error && j.error.message);
      return j.data;
    } catch (e) {
      if (!(e instanceof ApiError)) e = new ApiError('INTERNAL', '無法連線，請稍後再試');
      if (['AUTH_EXPIRED', 'AUTH_INVALID', 'AUTH_REQUIRED', 'FORBIDDEN'].includes(e.code) && action !== 'registerAdmin') {
        if (Session.drop() && Session.token()) return api.call(action, data);   /* 預約後台的登入不能用，改試小遊戲自己的 */
        if (e.code !== 'FORBIDDEN' && Session.hasOwn()) U.ls.del(Session.own);
        App.needLogin = e.code === 'FORBIDDEN' ? 'forbidden' : e.message;
      }
      throw e;
    }
  }
};
const LineAuth = {
  start() {
    const state = U.rid(12), nonce = U.rid(12);
    U.ss.set('miaplay.admin.oauth', JSON.stringify({ state, nonce, back: location.hash || '#/' }));
    const p = new URLSearchParams({ response_type: 'code', client_id: CFG.LINE_LOGIN_CHANNEL_ID, redirect_uri: ADMIN_URL, state, scope: 'openid profile', nonce });
    location.href = 'https://access.line.me/oauth2/v2.1/authorize?' + p;
  },
  async handleReturn() {
    const qs = new URLSearchParams(location.search); if (!qs.get('code') && !qs.get('error')) return;
    let st = {}; try { st = JSON.parse(U.ss.get('miaplay.admin.oauth') || '{}'); } catch (e) { }
    U.ss.del('miaplay.admin.oauth');
    history.replaceState(null, '', location.pathname + (st.back || '#/'));
    if (qs.get('error') || qs.get('state') !== st.state) return toast('LINE 登入未完成，請再試一次', 'err');
    try {
      const r = await api.call('authLine', { code: qs.get('code'), redirectUri: ADMIN_URL, nonce: st.nonce });
      Session.setOwn({ token: r.token, user: r.user, expiresAt: r.expiresAt }); U.ss.del('miaplay.admin.skip');
    } catch (e) { errToast(e); }
  }
};

/* ---------- 版面 ---------- */
const NAV = [['#/', '本週總覽'], ['#/games', '遊戲清單'], ['#/templates', '範本庫'], ['#/bank', '題庫'], ['#/data', '數據分析'], ['#/players', '玩家'], ['#/cal', '年末撕日曆'], ['#/rules', '稱號與獎勵'], ['#/themes', '主題樣式'], ['#/settings', '設定']];
const App = {
  needLogin: '',
  mount(title, inner, on, tools) {
    const u = Session.user() || {};
    $('#app').innerHTML = `<div class="A"><aside class="side" aria-label="後台選單"><a class="logo" href="#/"><span class="pearl" aria-hidden="true"></span><span><b>Mia</b><small>互動後台</small></span></a>
      <nav class="nav">${NAV.map(([h, l]) => `<a href="${h}" class="${on === h ? 'on' : ''}"${on === h ? ' aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
      <div class="sw"><a href="${esc(CFG.PLAY_URL)}"${IS_DEMO ? "" : " target=\"_blank\" rel=\"noopener\""}>→ 打開小遊戲</a><a href="${esc(CFG.MAIN_ADMIN_URL)}">→ 預約後台</a><a href="${esc(CFG.CARE_ADMIN_URL)}">→ 陪伴後台</a><span class="small muted" style="padding:4px 12px">${esc(u.displayName || '')}・管理員</span></div></aside>
      <main class="main"><div class="ph"><h1>${esc(title)}</h1>${IS_DEMO ? '<span class="demo">展示模式</span>' : ''}${tools || ''}</div>${inner}</main></div>`;
    window.scrollTo(0, 0);
  },
  loading(title, on) { this.mount(title, '<div class="spin" role="status"><i></i><span class="sr">載入中</span></div>', on); },
  login(msg) {
    const forb = msg === 'forbidden' && Session.hasOwn();
    $('#app').innerHTML = `<div class="login"><span class="pearl" style="margin:0 auto;width:40px;height:40px"></span><h1 style="font-family:var(--serif);font-size:22px">Mia 小遊戲・互動後台</h1>
      ${forb ? `<p>這個 LINE 帳號還不是互動後台的管理員。第一次使用請輸入<b>開通碼</b>（部署步驟第一步執行 setup 時顯示的 8 個字）。</p>
        <div class="f" style="text-align:left"><label for="sc">開通碼</label><input id="sc" class="in" autocomplete="off" placeholder="例如 3F9A1C2B"></div><span class="err" id="se" role="alert"></span>
        <button class="btn" data-reg>開通</button><button class="btn l" data-out>換一個帳號</button>`
      : `<p class="muted">${esc(msg && msg !== 'forbidden' ? msg : '已經登入預約後台的話，會直接認得你。')}</p>
        ${IS_DEMO ? '<button class="btn" data-demo="shared">展示：已登入預約後台的 Mia</button><button class="btn l" data-demo="own">展示：用小遊戲自己的 LINE 登入</button>' : '<button class="btn" data-line>用 LINE 登入</button>'}
        <p class="small muted">也可以先登入<a href="${esc(CFG.MAIN_ADMIN_URL)}">預約後台</a>，再回到這裡。</p>`}
      ${IS_DEMO && forb ? '<p class="small muted">展示用開通碼：DEMO1234</p>' : ''}</div>`;
    $$('[data-demo]').forEach(b => b.addEventListener('click', () => {

function srcCard(a) {

function heatCard(a) {
  const days = [[1, '週一'], [2, '週二'], [3, '週三'], [4, '週四'], [5, '週五'], [6, '週六'], [0, '週日']];
  let mx = 1; for (const k in a.heat) mx = Math.max(mx, a.heat[k]);
  const col = v => { const t = v / mx; return t === 0 ? 'background:#F5F1EE;color:#8A8079' : t < .34 ? 'background:#F8DCCF;color:#6B2E1C' : t < .67 ? 'background:#E59C80;color:#3E170C' : 'background:#B5523B;color:#fff'; };
  return `<div class="card"><h2>通常什麼時候玩</h2><div class="hm"><span></span>${a.slots.map(s => `<span class="small muted">${esc(s[1])}</span>`).join('')}

function blankGame(type) {
  const q = type === 'quiz' ? { q: '', options: [{ t: '', r: 'r1' }, { t: '', r: 'r2' }, { t: '', r: 'r3' }, { t: '', r: 'r4' }] } : type === 'trivia' ? { q: '', options: ['', '', '', ''], answer: 0, explain: '' } : { q: '', options: ['', '', '', ''] };
  const cfg = { intro: '', questions: [q] };
  if (type === 'quiz') cfg.results = { r1: { title: '', text: '', color: '#6F8FC7' }, r2: { title: '', text: '', color: '#E39A5B' }, r3: { title: '', text: '', color: '#6FA582' }, r4: { title: '', text: '', color: '#9A86C8' } };
  if (type === 'poll') cfg.thanks = '';
  const mon = nextMonday();
  return { id: '', week: '', title: '', type, startAt: mon + 'T00:00:00+08:00', endAt: addDays(mon, 7) + 'T00:00:00+08:00', published: false, notes: '', config: cfg };
}
function nextMonday() { const t = new Date(Date.now() + 8 * 3600e3); const wd = (t.getUTCDay() + 6) % 7; return new Date(t.getTime() + (7 - wd) * 86400e3).toISOString().slice(0, 10); }
function addDays(ymd, n) { return new Date(Date.parse(ymd + 'T00:00:00Z') + n * 86400e3).toISOString().slice(0, 10); }

    App.mount(g.id ? '編輯：' + (g.title || '') : '新增' + TYPES[g.type], `

        <div class="f"><span class="lbl" id="cv-l">大廳封面底色</span><div class="cvs" role="radiogroup" aria-labelledby="cv-l">${[['', '自動輪流']].concat(Object.keys(COVERS).map(k => [k, COVERS[k]])).map(([k, n]) => `<label class="cv"><input type="radio" name="cv" value="${k}" ${(c.cover || '') === k ? 'checked' : ''}><span style="background:${k ? COVER_BG[k] : 'repeating-linear-gradient(135deg,#24314F 0 8px,#4A2F45 8px 16px,#2E4A3E 16px 24px)'}"></span>${n}</label>`).join('')}</div></div>
        ${g.type === 'poll' ? `<div class="f"><label for="e-thanks">投完顯示的一句話</label><input id="e-thanks" class="in" value="${esc(c.thanks || '')}"></div>` : ''}
        <label class="sw2"><input type="checkbox" id="e-pub" ${g.published ? 'checked' : ''}> 公開（到了開放時間就出現在大廳）</label></div>
      ${results}
      <div class="card"><h2>題目（${c.questions.length} 題）<span class="r"><button class="btn s l" data-addq>＋ 新增一題</button></span></h2>${qHtml}</div>
      <div class="card"><h2>給製作指令的補充（可不填）</h2><div class="f"><textarea id="e-notes" placeholder="例如：結果文字可以多一點畫面感">${esc(g.notes || '')}</textarea></div></div>

  collect() {

    c.intro = $('#e-intro').value.trim(); c.cover = ($('input[name=cv]:checked') || {}).value || ''; if ($('#e-thanks')) c.thanks = $('#e-thanks').value.trim();
    g.published = $('#e-pub').checked; g.notes = $('#e-notes').value;
    $$('[data-q]').forEach(el => { c.questions[+el.dataset.q].q = el.value; });
    $$('[data-o]').forEach(el => { const [i, j] = el.dataset.o.split(':').map(Number); const op = c.questions[i].options[j]; if (typeof op === 'string') c.questions[i].options[j] = el.value; else op.t = el.value; });
    $$('[data-ans]').forEach(el => { if (el.checked) { const [i, j] = el.dataset.ans.split(':').map(Number); c.questions[i].answer = j; } });
    $$('[data-r]').forEach(el => { const [i, j] = el.dataset.r.split(':').map(Number); c.questions[i].options[j].r = el.value; });
    $$('[data-ex]').forEach(el => { c.questions[+el.dataset.ex].explain = el.value; });
    $$('[data-rt]').forEach(el => { c.results[el.dataset.rt].title = el.value; });

    const ar = $('[data-addr]'); if (ar) ar.addEventListener('click', () => { this.collect(); let n = 1; while (c.results['r' + n]) n++; c.results['r' + n] = { title: '', text: '', color: '#B5523B' }; this.render(); });

const EXPORT_FORMAT = '{"format":"mia-play-templates","version":1,"games":[{"title":"","type":"quiz｜trivia｜poll","notes":"","config":{"intro":"","questions":[],"results":{}}}]}';
function makePrompt(g, m) {
  const c = g.config || {}, qs = c.questions || [], n = qs.length, op = qs[0] ? qs[0].options.length : 4;
  const lines = [];
  if (g.type === 'quiz') {
    const rs = Object.keys(c.results || {});
    lines.push(`請幫我做一款 Mia 小遊戲的「測驗」，沿用「${g.title}」的框架：`, `・${n} 題，每題 ${op} 個選項，每個選項對應一種結果`, `・${rs.length} 種結果，每種有名稱、一段 40 字內的溫柔建議、一個代表色（色碼）`, '・結果用「選最多的那一種」決定，同分時取第一個');
  } else if (g.type === 'trivia') {
    lines.push(`請幫我做一款 Mia 小遊戲的「問答」，沿用「${g.title}」的框架：`, `・${n} 題，每題 ${op} 個選項，只有一個正確答案`, '・每題附一句答案說明（30 字內）', '・難度：大部分人能答對一半以上，有一兩題需要想一下');
  } else {
    lines.push(`請幫我做一款 Mia 小遊戲的「心情投票」，沿用「${g.title}」的框架：`, `・${n} 題，每題 ${op} 個選項，選完看大家的比例`, '・投完顯示一句溫暖的話');
  }
  lines.push('・語氣：溫柔、像朋友聊天，不說教，不提醫療或診斷', '・開場說明一句話');
  if (qs[0] && qs[0].q) lines.push(`・參考原本的第一題：「${qs[0].q}」`);
  lines.push('這次的主題：【在這裡寫新主題】');
  if (m && m.players) lines.push(`這款上次的表現：${m.players} 人、完成率 ${U.pct(m.completion)}、分享率 ${U.pct(m.shareRate)}${m.topResult ? `（最多人測出「${m.topResult}」）` : ''}`);
  if (g.notes) lines.push('Mia 的補充：' + g.notes);
  lines.push('', '請用下面的 JSON 格式回覆（questions 裡：測驗的選項是 {"t":"文字","r":"結果代號"}，results 用結果代號當 key，內容是 {"title","text","color"}；問答的選項是文字陣列，加上 "answer":正確選項的位置（從 0 開始）和 "explain"；心情投票的選項是文字陣列，config 加上 "thanks"），我會直接匯入後台：', EXPORT_FORMAT);
  return lines.join('\n');
}

  $('[data-imp]').addEventListener('click', async () => {

function contrast(a, b) { const x = lum(a), y = lum(b); if (x == null || y == null) return null; return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }

/* ----- 盲盒與獎勵 ----- */
async function calBox() {
  const [o, st] = await Promise.all([api.call('adminCalOverview'), api.call('adminCalSettings', {})]);
  const box = o.box || {}, sum = a => a.reduce((s, k) => s + (box[k] || 0), 0);
  const groups = [['小紙條（空盒）', [CALSW.empty]], ['一般小物', CALSW.common], ['貓咪棒棒糖（稀有）', CALSW.rare], ['金色貓咪糖（超稀有）', [CALSW.gold]], ['票券糖（折抵券）', [CALSW.ticket]]];
  const total = groups.reduce((s, g) => s + sum(g[1]), 0) || 1, pr = st.settings.prob || {}, pk = ['empty', 'common', 'rare', 'gold', 'ticket'];
  const mt = Object.values(o.marbles || {}).reduce((a, b) => a + b, 0) || 1;
  calMount('box', `
    <div class="card"><h2>盲盒發出<span class="r small muted">共 ${total === 1 && !sum(groups[0][1]) ? 0 : total} 次</span></h2><div class="tw"><table><thead><tr><th>開到什麼</th><th>設定機率</th><th>實際發出</th><th>實際比例</th></tr></thead><tbody>
      ${groups.map((g, i) => `<tr><td>${g[0]}</td><td class="num">${pr[pk[i]] != null ? pr[pk[i]] + '%' : '—'}</td><td class="num">${sum(g[1])}</td><td class="num">${Math.round(sum(g[1]) / total * 100)}%</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">金色貓咪糖每人最多 1 次，之後抽到會改成稀有款。折抵券本月已發 <b>${o.coupons.month}</b> / ${o.coupons.cap} 張，發完改成金色貓咪糖（已有就改稀有款）。機率在「設定」調整。</p></div>
    <div class="two"><div class="card"><h2>貓咪棒棒糖</h2><div class="bars">${CALSW.rare.map(k => `<div class="bar"><span>${esc(k.replace('棒棒糖', ''))}</span><span class="tr"><i style="width:${Math.min(100, (box[k] || 0) * 10)}%"></i></span><span class="num">${box[k] || 0}</span></div>`).join('')}</div></div>
      <div class="card"><h2>一般小物</h2><div class="bars">${CALSW.common.map(k => `<div class="bar"><span>${esc(k)}</span><span class="tr"><i style="width:${Math.min(100, (box[k] || 0) * 10)}%"></i></span><span class="num">${box[k] || 0}</span></div>`).join('')}</div></div></div>
    <div class="two"><div class="card"><h2>大家選的糖果口味</h2><div class="bars">${Object.keys(o.marbles || {}).map(k => `<div class="bar"><span>${esc(k)}</span><span class="tr"><i style="width:${Math.round(o.marbles[k] / mt * 100)}%"></i></span><span class="num">${o.marbles[k]}</span></div>`).join('')}</div></div>
      <div class="card"><h2>折抵券</h2><p>已發 <b class="num">${o.coupons.total}</b> 張・已使用 <b class="num">${o.coupons.used}</b> 張</p><a class="btn s l" style="margin-top:8px" href="#/cal/coupon">去核銷</a>
      <h2 style="margin-top:14px">登機證封號（依撕的頁數）</h2>${Object.keys(o.titles || {}).map(k => `<p class="small">${esc(k)}：<b>${o.titles[k]}</b> 人</p>`).join('') || '<p class="small muted">還沒有人</p>'}</div></div>`);
}

async function calCoupon(code) {
  const list = await api.call('adminCalCoupons');
  let found = null, ferr = '';
  if (code) { try { found = (await api.call('adminCouponLookup', { code })).coupon; } catch (e) { ferr = e.message; } }
  const stc = s => s === '未使用' ? 'c-open' : s === '已使用' ? 'c-closed' : 'c-draft';
  calMount('coupon', `
    <div class="card"><h2>查詢券號</h2><div class="row"><div class="f"><label for="cc">券號</label><input id="cc" class="in" value="${esc(code || '')}" placeholder="MIA-2026-XXXX" autocapitalize="characters"></div><div class="f" style="flex:0;justify-content:flex-end"><button class="btn" data-q>查詢</button></div></div>
      ${ferr ? `<p class="err">${esc(ferr)}</p>` : ''}
      ${found ? `<div class="cpbox"><div><b style="font-size:18px">${found.amount} 元折抵券</b>　<span class="chip ${stc(found.status)}">${esc(found.status)}</span></div>
        <p class="small">券號 <b class="num">${esc(found.code)}</b>・抽中 ${esc(found.at)}・效期到 ${esc(found.expiresAt)}</p><p class="small">可用於：${esc(found.plans)}</p>
        ${found.status === '已使用' ? `<p class="err">已在 ${esc(found.usedAt)} 用於「${esc(found.usedFor)}」</p>` : found.status === '過期' ? '<p class="err">這張券已經過期了</p>' : `
        <div class="row" style="margin-top:8px"><div class="f"><label for="ud">使用日期</label><input id="ud" type="date" class="in" value="${new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10)}"></div><div class="f"><label for="uf">用在哪個方案</label><select id="uf" class="in"><option value="">請選擇</option>${String(found.plans || '').split('、').map(p => `<option>${esc(p)}</option>`).join('')}</select></div><div class="f" style="flex:0;justify-content:flex-end"><button class="btn" data-use>標記已使用</button></div></div>`}</div>` : ''}</div>
    <div class="card"><h2>所有折抵券 ${list.items.length}</h2><div class="tw"><table><thead><tr><th>券號</th><th>面額</th><th>抽中</th><th>效期到</th><th>狀態</th><th>使用</th></tr></thead><tbody>
      ${list.items.map(c => `<tr><td><button class="btn g s" data-code="${esc(c.code)}">${esc(c.code)}</button></td><td class="num">${c.amount}</td><td class="num">${esc(c.at)}</td><td class="num">${esc(c.expiresAt)}</td><td><span class="chip ${stc(c.status)}">${esc(c.status)}</span></td><td class="small">${c.usedAt ? esc(c.usedAt) + '・' + esc(c.usedFor) : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">還沒有折抵券</td></tr>'}</tbody></table></div>
      <p class="small muted" style="margin-top:8px">券可以轉送，認券不認人；一張只能用一次。</p></div>`);
  const q = () => { const v = $('#cc').value.trim(); App.loading('年末撕日曆', '#/cal'); calCoupon(v).catch(e => App.fail(e)); };
  $('[data-q]').addEventListener('click', q); $('#cc').addEventListener('keydown', e => { if (e.key === 'Enter') q(); });

  const u = $('[data-use]'); if (u) u.addEventListener('click', async () => { try { await api.call('adminCouponUse', { code: found.code, usedAt: $('#ud').value, usedFor: $('#uf').value }); toast('已標記使用'); calCoupon(found.code); } catch (e) { errToast(e); } });

      <button class="btn d s" data-clear>清除我自己的測試紀錄</button></div>
    <div class="card"><h2>期間</h2><p class="small">12/1 開始每天一頁；1/1–1/31 只能補撕；2/1 起糖罐封存，7/1 再打開。期間是固定的，不需要設定。</p></div>`);
  const sum = () => { const t = P.reduce((a, [k]) => a + (+$('#p-' + k).value || 0), 0); $('#psum').innerHTML = Math.abs(t - 100) < .01 ? `<span class="okt">合計 100%</span>` : `<span class="err">合計 ${Math.round(t * 100) / 100}%，要剛好 100%</span>`; };
  $$('.pr').forEach(i => i.addEventListener('input', sum)); sum();
  $('[data-def]').addEventListener('click', () => { P.forEach(([k]) => { $('#p-' + k).value = d.def.prob[k]; }); sum(); });
  $('[data-sv]').addEventListener('click', async () => { const prob = {}; P.forEach(([k]) => { prob[k] = +$('#p-' + k).value || 0; }); try { await api.call('adminCalSettings', { save: { prob, monthCap: +$('#mc').value, negThreshold: +$('#nt').value } }); toast('已儲存'); } catch (e) { errToast(e); } });
  $('[data-pv]').addEventListener('click', async () => { try { await api.call('adminCalSettings', { save: { previewDate: $('#pv').value } }); toast('已套用，打開撕日曆就是這一天'); } catch (e) { errToast(e); } });
  $('[data-pvoff]').addEventListener('click', async () => { try { await api.call('adminCalSettings', { save: { previewDate: '' } }); $('#pv').value = ''; toast('已關掉預覽'); } catch (e) { errToast(e); } });
  $('[data-clear]').addEventListener('click', async () => { if (!(await modal('清除我自己的測試紀錄', '<p>會刪掉你這個管理員帳號在撕日曆裡的紀錄和抽到的折抵券，玩家的紀錄不受影響。</p>', [{ l: '取消', v: null, c: 'l' }, { l: '清除', v: 1, c: 'd' }]))) return; try { const r = await api.call('adminCalClearMine', {}); toast('已清除 ' + r.removed + ' 筆'); } catch (e) { errToast(e); } });
}

function route() {
  if (!Session.token()) return App.login();
  const h = location.hash || '#/'; let m;
  if (h === '#/games') return pGames();
  if (h === '#/new') return pNew();
  if ((m = h.match(/^#\/edit\/(.+)/))) return Edit.load(decodeURIComponent(m[1]));
  if ((m = h.match(/^#\/game\/(.+)/))) return pGame(decodeURIComponent(m[1]));
  if (h === '#/templates') return pTemplates();
  if (h === '#/bank') return pBank();
  if (h === '#/data') return pData();
  if (h === '#/players') return pPlayers();
  if (h === '#/rules') return pRules();
  if (h === '#/themes') return pThemes();
  if (h === '#/settings') return pSettings();
  if ((m = h.match(/^#\/cal(?:\/(\w+))?/))) return pCal(m[1]);
  return pOverview();
}
(async function boot() { if (!IS_DEMO) await LineAuth.handleReturn(); window.addEventListener('hashchange', route); route(); })();
})();
</script>
</body>
</html>
